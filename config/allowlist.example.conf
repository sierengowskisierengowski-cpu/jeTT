# jeTT allowlist + daemon trust — copy to /etc/jett/allowlist.conf
# Override: export JETT_ALLOWLIST=/path/to/allowlist.conf
#
# Guard own-stack ALLOW (before model):
#   exe:/path/prefix/       — fast ALLOW when exe starts with prefix
#   script:/path/prefix/    — fast ALLOW for python3 cmdline starting here
#
# Daemon Trusted disposition (0ms, no model):
#   trusted_path:/prefix/   — exe_path starts with prefix (NOT cmdline args)
#   trusted_proc:name         — exact comm/exe basename match (NOT lolbins)
#   toolchain_marker:substr   — exe path contains marker (build trees)
#   toolchain_bin:name        — comm name in build context
#
# Missing file → defaults derived from $HOME + system paths (/usr/bin/, etc.)
#
# Replace $HOME below with the actual home directory of the user running jeTT,
# or use the $HOME variable if your init system supports shell expansion here.
# Example: if jett runs as user "alice", replace $HOME with /home/alice.
#
# SECURITY NOTE: trusted_path and trusted_proc match only exe_path/comm, NOT
# cmdline arguments, to prevent `./malware --config /usr/bin/foo` bypasses.

# --- Guard own-stack (update $HOME to match install user) ---
exe:$HOME/Scripts/utilities/
exe:$HOME/Scripts/deployed/
exe:$HOME/Projects/GNI/
exe:$HOME/Projects/jeTT/
exe:$HOME/Projects/bifrost/
exe:$HOME/.local/share/Steam/
exe:$HOME/.cargo/
exe:$HOME/.rustup/
exe:/tmp/cargo-install
script:$HOME/Scripts/

# --- Daemon trusted paths (prefix match on exe_path only) ---
trusted_path:$HOME/Projects/
trusted_path:$HOME/Scripts/
trusted_path:/usr/bin/
trusted_path:/usr/lib/
trusted_path:/usr/share/
trusted_path:/etc/systemd/
trusted_path:/opt/jett/

# --- Daemon trusted process name exact-basename matches ---
trusted_proc:bifrost
trusted_proc:ollama
trusted_proc:docker
trusted_proc:cowrie
trusted_proc:prometheus
trusted_proc:grafana
trusted_proc:loki
trusted_proc:promtail
trusted_proc:portainer
trusted_proc:mosquitto
trusted_proc:cosmic-comp
trusted_proc:cargo
trusted_proc:rclone
trusted_proc:meshtastic
trusted_proc:gni_server
trusted_proc:systemd
trusted_proc:sshd
trusted_proc:pacman
trusted_proc:yay
trusted_proc:jett
trusted_proc:wireguard
trusted_proc:wg
trusted_proc:tmux
trusted_proc:screen
trusted_proc:rustc
trusted_proc:cc1plus
trusted_proc:cc1
trusted_proc:cicc
trusted_proc:nvcc
trusted_proc:ptxas
trusted_proc:fatbinary
trusted_proc:cmake
trusted_proc:make
trusted_proc:ccache
trusted_proc:collect2
trusted_proc:electron
trusted_proc:git
trusted_proc:cursorsandbox

# --- Compiler/build toolchain (truncated comm in build dirs) ---
toolchain_marker:/target/release/build/
toolchain_marker:/target/debug/build/
toolchain_marker:cursor-sandbox-cache
toolchain_marker:/cargo-target/
toolchain_marker:/usr/lib/ccache/
